const DZF={};function wdz(id,fn){const el=document.querySelector(`.dz[data-id="${id}"]`);if(!el)return;DZF[id]=fn;el.addEventListener('mouseenter',()=>{window.__DZ=id});const inp=el.querySelector('input');el.onclick=()=>{window.__DZ=id;inp.click()};inp.onchange=()=>inp.files[0]&&img(inp.files[0],fn);['dragenter','dragover'].forEach(v=>el.addEventListener(v,e=>{e.preventDefault();el.classList.add('hot')}));el.addEventListener('dragleave',()=>el.classList.remove('hot'));el.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();el.classList.remove('hot');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f){if(f.type.startsWith('image/')||/\.(jpe?g|png|gif|webp|heic|heif|avif|bmp)$/i.test(f.name||''))img(f,fn);else toast('That is not a picture file');return}const u=(e.dataTransfer.getData('text/uri-list')||'').split('\n')[0].trim();if(/^https?:/i.test(u))fetch(u).then(r=>r.blob()).then(b=>img(b,fn)).catch(()=>toast('That website blocks copying. Save the picture to your device, then drop the file here.'))});el.addEventListener('dragend',()=>el.classList.remove('hot'))}
function fb(id,cur,extra){const L=(a,b)=>extra?`<span class="lg">${a}</span><span class="sh">${b}</span>`:a;return `<div class="fb${extra?' sm':''}" data-fit="${id}"><div class="note">Resize &amp; fit this image:</div><span class="fbp"><button data-v="cover" class="${cur==='contain'?'':'act'}">${L('Fill frame','Fill')}</button><button data-v="contain" class="${cur==='contain'?'act':''}">${L('Fit whole image','Fit')}</button></span>${extra||''}</div>`}
/* sl(): one compact slider (label above, slider below); two of these sit side by side in a .sg row */
const sl=(lab,unit,cls,data,min,max,val,rc,span,yl)=>`<div class="sc"><label${yl?' class="ylwl"':''}>${lab} <b id="${span}">${val}</b>${unit}</label><input type="range" class="${cls}" style="--rc:${rc}" ${data} min="${min}" max="${max}" value="${val}"></div>`;

function trHTML(){
